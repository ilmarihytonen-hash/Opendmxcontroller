name: Build desktop packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows app
        shell: pwsh
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LumenDesk-Windows
          path: dist/LumenDesk/
          if-no-files-found: error
          retention-days: 14

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3-venv python3-dev libasound2-dev libxcb-util1 libxcb-xkb1 libxcb-keysyms1 libxcb-render-util0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-cursor0 libxcb-image0 curl patchelf
      - name: Build AppImage
        run: ./scripts/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LumenDesk-Ubuntu
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
